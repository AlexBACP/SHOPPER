# ─────────────────────────────────────────────────────────────
#  SHOPPER · docker-compose (base)
#  Levanta: backend (NestJS) + frontend (Next.js) + Postgres + Mongo + Redis
#
#  Este base está pensado para PRODUCCIÓN (target prod, sin bind mounts).
#  En DESARROLLO, docker-compose.override.yml se aplica solo y reactiva
#  el hot-reload:
#    docker compose up --build       # DEV  (base + override automático)
#    docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d  # PROD
# ─────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: shopper_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1234}
      POSTGRES_DB:       ${DB_NAME:-shopperdb}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-shopperdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── MongoDB ──────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: shopper_mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Redis ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: shopper_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Backend (NestJS) ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      target: prod
    container_name: shopper_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Sobrescribe los hosts del .env para apuntar a los servicios de compose
      DB_HOST: postgres
      DB_PORT: 5432
      MONGODB_URI: mongodb://mongo:27017/shopper_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FRONTEND_URL: http://localhost:3000
      NODE_ENV: production
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-3001}:3001"
    # Sin bind mounts aquí: los montajes de desarrollo viven en
    # docker-compose.override.yml (se aplican solo con `docker compose up`).
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Frontend (Next.js) ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      target: prod
    container_name: shopper_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NODE_ENV: production
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:3000"
    # Sin bind mounts aquí (ver docker-compose.override.yml para dev)
    depends_on:
      - backend

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  backend_node_modules:
  frontend_node_modules:
  frontend_next_cache:
