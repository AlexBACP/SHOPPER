# ─────────────────────────────────────────────────────────────
#  SHOPPER · docker-compose (desarrollo)
#  Levanta: backend (NestJS) + frontend (Next.js) + Postgres + Mongo + Redis
#
#  Uso:
#    docker compose up --build
#    docker compose down              # parar
#    docker compose down -v           # parar + borrar datos
# ─────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: shopper_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1234}
      POSTGRES_DB:       ${DB_NAME:-shopperdb}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-shopperdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── MongoDB ──────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: shopper_mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Redis ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: shopper_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Backend (NestJS) ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      target: dev
    container_name: shopper_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Sobrescribe los hosts del .env para apuntar a los servicios de compose
      DB_HOST: postgres
      DB_PORT: 5432
      MONGODB_URI: mongodb://mongo:27017/shopper_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FRONTEND_URL: http://localhost:3000
      NODE_ENV: development
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-3001}:3001"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Frontend (Next.js) ───────────────────────────────────
  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: shopper_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NODE_ENV: development
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  backend_node_modules:
  frontend_node_modules:
  frontend_next_cache:
