# ─────────────────────────────────────────────────────────────
#  SHOPPER · Nginx reverse proxy
#  Destino en el servidor: /etc/nginx/sites-available/proyectoscampus
#  Activar con: ln -s ../sites-available/proyectoscampus /etc/nginx/sites-enabled/
#
#  Este archivo es la versión HTTP (puerto 80). Después de correr
#  `certbot --nginx` se añaden automáticamente los bloques 443 + SSL.
# ─────────────────────────────────────────────────────────────

# ── Frontend (Next.js) → proyectoscampus.top ────────────────
server {
    listen 80;
    listen [::]:80;
    server_name proyectoscampus.top www.proyectoscampus.top;

    client_max_body_size 25M;   # subida de imágenes de productos

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         'upgrade';
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ── Backend (NestJS) → api.proyectoscampus.top ──────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.proyectoscampus.top;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         'upgrade';
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
