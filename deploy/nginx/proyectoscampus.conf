# ─────────────────────────────────────────────────────────────
#  SHOPPER · Nginx reverse proxy (servidor compartido)
#  Destino: /etc/nginx/sites-available/shopper
#
#  Un solo dominio: shopper.proyectoscampus.top
#    /api/*  → backend NestJS  (127.0.0.1:3031, se quita el prefijo /api)
#    /*      → frontend Next.js (127.0.0.1:3030)
#
#  El SSL ya lo emitió certbot para shopper.proyectoscampus.top.
# ─────────────────────────────────────────────────────────────

# HTTP → redirige todo a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name shopper.proyectoscampus.top;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name shopper.proyectoscampus.top;

    ssl_certificate     /etc/letsencrypt/live/shopper.proyectoscampus.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shopper.proyectoscampus.top/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25M;   # subida de imágenes de productos

    # ── API (NestJS) bajo /api/ → backend, quitando el prefijo /api ──
    #    El "/" final en proxy_pass hace que /api/stores → /stores
    location /api/ {
        proxy_pass http://127.0.0.1:3031/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         'upgrade';
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Frontend (Next.js) ──
    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         'upgrade';
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
