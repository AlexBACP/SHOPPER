# ─────────────────────────────────────────────────────────────
#  SHOPPER · Nginx reverse proxy (servidor compartido)
#  Destino en el servidor: /etc/nginx/sites-available/shopper
#  Activar: ln -s /etc/nginx/sites-available/shopper /etc/nginx/sites-enabled/
#
#  Versión HTTP (puerto 80). Tras `certbot --nginx` se añaden los
#  bloques 443 + SSL automáticamente.
#
#  Puertos locales (solo 127.0.0.1, los publica docker-compose.prod.yml):
#    frontend → 3030   ·   backend → 3031
# ─────────────────────────────────────────────────────────────

# ── Frontend (Next.js) → shopper.proyectoscampus.top ────────
server {
    listen 80;
    listen [::]:80;
    server_name shopper.proyectoscampus.top;

    client_max_body_size 25M;   # subida de imágenes de productos

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         'upgrade';
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ── Backend (NestJS) → shopper-api.proyectoscampus.top ──────
server {
    listen 80;
    listen [::]:80;
    server_name shopper-api.proyectoscampus.top;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:3031;
        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         'upgrade';
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
