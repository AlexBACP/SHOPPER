# ─────────────────────────────────────────────────────────────
#  SHOPPER · docker-compose (producción)
#  Override que cambia los servicios a la imagen `prod` final
#  (sin bind mounts, sin hot reload, ejecutando el código compilado).
#
#  Pensado para un SERVIDOR COMPARTIDO: no expone las bases de datos
#  al exterior y publica frontend/backend solo en 127.0.0.1, detrás de
#  Nginx, en puertos que no chocan con otros proyectos.
#
#  Uso:
#    docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
# ─────────────────────────────────────────────────────────────

services:
  # NOTA: los puertos del host se definen en docker-compose.yml (base) y se
  # controlan con las variables FRONTEND_HOST_PORT / BACKEND_HOST_PORT del .env.
  # No se redefinen aquí porque Compose CONCATENA listas de ports (no las reemplaza).
  backend:
    build:
      context: ./backend
      target: prod
    environment:
      NODE_ENV: production
      # En prod estas URLs deben ser el dominio público (override del localhost de dev)
      FRONTEND_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      BACKEND_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    volumes: []        # quita bind mounts de dev
    command: ["node", "dist/main"]

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        # Estas variables NEXT_PUBLIC_* se embeben en el bundle del cliente
        # durante `next build`. Si tu API o sitio cambian de URL, edítalas aquí.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    volumes: []        # quita bind mounts de dev
    command: ["node", "server.js"]
